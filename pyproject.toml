[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "assistant-core"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "python-dotenv>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
